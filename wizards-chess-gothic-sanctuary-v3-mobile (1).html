<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b101b" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Wizard's Chess — Gothic Sanctuary</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{--gold:#d9b84a;--tx:#f2f6fc;--mut:#9fb0c8;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--tx);background:radial-gradient(circle at 50% 35%,#34486f 0%,#1a2540 58%,#0d1428 100%)}
#canvas-container{position:fixed;inset:0;z-index:1}
#canvas-container canvas{display:block;touch-action:none}
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(6,10,24,.32) 100%)}

/* ---------- Liquid glass ---------- */
.glass{position:relative;overflow:hidden;border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 45%,rgba(150,185,255,.08));
  border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);
  box-shadow:0 14px 38px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.04);
  animation:rise .9s var(--ease) both}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 90% at 18% 0%,rgba(255,255,255,.24),transparent 55%);
  animation:breathe 6s ease-in-out infinite}
.glass>*{position:relative;z-index:1}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.85}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(217,184,74,0),inset 0 1px 0 rgba(255,255,255,.3)}50%{box-shadow:0 0 20px rgba(217,184,74,.38),inset 0 1px 0 rgba(255,255,255,.42)}}
/* the top bar is centred with translateX(-50%): its entrance animation must keep that transform
   (the plain "rise" keyframes end in transform:none, which pushed the bar half its width to the right) */
@keyframes riseC{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.985)}to{opacity:1;transform:translateX(-50%)}}
@keyframes dotb{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.25);opacity:1}}

#top-bar{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:10;
  display:flex;align-items:center;gap:16px;padding:11px 20px;white-space:nowrap;max-width:calc(100vw - 20px);animation-name:riseC}
.brand{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.sep{width:1px;height:18px;background:rgba(255,255,255,.16)}
.turn{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:600;letter-spacing:.03em}
.dot{width:10px;height:10px;border-radius:50%;background:#f1f5f9;box-shadow:0 0 12px rgba(241,245,249,.8);animation:dotb 3s ease-in-out infinite}
.dot.b{background:#64748b;box-shadow:0 0 12px rgba(100,116,139,.9)}
#faction-badge{font-size:.7rem;font-weight:700;letter-spacing:.08em;padding:5px 10px;border-radius:9px;
  background:rgba(217,184,74,.13);border:1px solid rgba(217,184,74,.4);color:var(--gold)}

/* Sound button — now top-left */
#sound-toggle-btn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));z-index:15;display:flex;align-items:center;gap:8px;
  padding:11px 15px;cursor:pointer;color:var(--tx);font-family:inherit;font-weight:600;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;
  transition:transform .4s var(--ease),border-color .4s,color .4s}
#sound-toggle-btn:hover{border-color:rgba(217,184,74,.6);transform:translateY(-1px)}
#sound-toggle-btn:active{transform:scale(.97)}
#sound-toggle-btn.muted{color:var(--mut)}

#bottom-hud{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:10px;max-width:96vw}
.row{display:flex;align-items:center;gap:8px;padding:9px 11px;flex-wrap:wrap;justify-content:center}
#bottom-hud .row:nth-child(2){animation-delay:.12s}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);margin:0 6px 0 4px;font-weight:600}

.short{display:none}
.btn{position:relative;overflow:hidden;color:var(--tx);cursor:pointer;touch-action:manipulation;font-family:inherit;font-weight:600;font-size:.78rem;letter-spacing:.03em;
  padding:9px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
  transition:transform .45s var(--ease),background .45s var(--ease),border-color .45s var(--ease),color .45s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);
  transform:translateX(-120%);transition:transform .9s var(--ease);pointer-events:none}
.btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.32)}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:scale(.96)}
.btn.active{background:linear-gradient(180deg,rgba(217,184,74,.36),rgba(217,184,74,.12));border-color:rgba(217,184,74,.75);color:#fff4cc;animation:glow 3.8s ease-in-out infinite}

#modal-overlay,#result-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(4,7,13,.6);
  opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
#modal-overlay.open,#result-overlay.open{opacity:1;pointer-events:auto}
#modal-box,#result-box{width:92%;max-width:430px;padding:24px;display:flex;flex-direction:column;gap:14px;transform:scale(.95) translateY(8px);transition:transform .5s var(--ease)}
#modal-overlay.open #modal-box,#result-overlay.open #result-box{transform:none}
#result-box{max-width:440px;align-items:center;text-align:center;padding:28px 26px 24px;gap:12px}
#result-box .m-act{justify-content:center}
.r-eyebrow{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.r-title{font-size:clamp(1.6rem,6.5vw,2.4rem);font-weight:800;letter-spacing:.05em;line-height:1.1;text-shadow:0 0 28px rgba(217,184,74,.35)}
#result-box.loss .r-eyebrow{color:#fda4af}#result-box.loss .r-title{text-shadow:0 0 28px rgba(244,63,94,.3)}
#result-box.draw .r-eyebrow{color:var(--mut)}#result-box.draw .r-title{text-shadow:0 0 28px rgba(150,185,255,.3)}
.r-desc{font-size:.88rem;line-height:1.55;opacity:.9;max-width:36ch}
.r-meta{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.r-score{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tx);padding:7px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05)}
.m-title{font-size:.92rem;font-weight:700;color:#fda4af;letter-spacing:.07em;text-transform:uppercase}
.m-desc{font-size:.86rem;line-height:1.55;color:var(--tx)}
.m-act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
/* ---------- Responsive layouts ---------- */
#faction-badge{overflow:hidden;text-overflow:ellipsis}
@media (max-width:920px){#top-bar{top:calc(70px + env(safe-area-inset-top,0px))}}
/* ---- phones, portrait: a slim status strip on top, ONE compact control bar at the bottom,
        so almost the whole screen is left for the board ---- */
@media (max-width:820px) and (orientation:portrait),(max-width:820px) and (min-height:561px){
  #sound-toggle-btn{top:calc(8px + env(safe-area-inset-top,0px));left:auto;right:calc(8px + env(safe-area-inset-right,0px));
    width:44px;height:44px;padding:0;justify-content:center;border-radius:14px}
  #sound-icon{font-size:1.05rem;line-height:1}
  #sound-label{display:none}

  #top-bar{top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(58px + env(safe-area-inset-right,0px));
    transform:none;width:auto;max-width:none;height:44px;padding:0 14px;border-radius:14px;
    flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;animation-name:rise}
  #top-bar .sep,.brand{display:none}
  .turn{font-size:.8rem;gap:9px;max-width:100%;min-width:0}
  #turn-indicator{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .dot{flex:none;width:9px;height:9px}
  #faction-badge{max-width:100%;padding:0 0 0 18px;border:0;background:none;border-radius:0;font-size:.56rem;letter-spacing:.13em;color:rgba(217,184,74,.88);white-space:nowrap}

  /* one glass bar holds both control groups */
  #bottom-hud{left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));
    bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:none;max-width:none;
    flex-direction:row;align-items:stretch;justify-content:space-between;gap:0;padding:7px 10px;overflow:hidden;
    border-radius:18px;border:1px solid rgba(255,255,255,.16);
    background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 45%,rgba(150,185,255,.08));
    -webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);
    box-shadow:0 14px 38px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.04);
    animation:rise .9s var(--ease) both}
  #bottom-hud::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(120% 90% at 18% 0%,rgba(255,255,255,.2),transparent 55%)}
  #bottom-hud .row.glass{display:grid;position:relative;z-index:1;padding:0;gap:3px 5px;border:0;border-radius:0;background:none;box-shadow:none;
    -webkit-backdrop-filter:none;backdrop-filter:none;overflow:visible;animation:none;justify-content:start}
  #bottom-hud .row.glass::before{display:none}
  #bottom-hud .row:nth-child(1){grid-template-columns:auto auto auto}
  #bottom-hud .row:nth-child(2){grid-template-columns:repeat(4,auto);padding-left:10px;border-left:1px solid rgba(255,255,255,.14);border-radius:0}
  .row .sep{display:none}
  .lbl{display:block;grid-column:1/-1;margin:0 0 0 2px;font-size:.5rem;letter-spacing:.16em;line-height:1}
  .full,.pn{display:none}
  .short{display:inline}
  .btn{height:36px;min-width:38px;padding:0 11px;border-radius:11px;font-size:.74rem;display:inline-flex;align-items:center;justify-content:center}
  .promo-btn{width:38px;padding:0;font-size:1.2rem;line-height:1}
  #new-game-btn{font-size:1.1rem}
  /* result / confirm dialogs: tighter, full-width actions */
  #modal-box,#result-box{width:calc(100% - 28px);padding:20px 18px}
  .m-act .btn{flex:1 1 0;white-space:nowrap}
}
@media (max-width:360px){#bottom-hud{padding:6px 8px}#bottom-hud .row:nth-child(2){padding-left:7px}.btn{min-width:36px;padding:0 9px}.promo-btn{width:36px}}
/* no sticky "hover" look after a tap on touch screens */
@media (hover:none){
  .btn:not(.active):hover{transform:none;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
  .btn:hover::after{transform:translateX(-120%)}
  #sound-toggle-btn:hover{transform:none;border-color:rgba(255,255,255,.16)}
}
/* phones on their side: HUD docks to the right edge in two columns */
@media (max-height:560px) and (orientation:landscape){
  #top-bar{top:calc(10px + env(safe-area-inset-top,0px));padding:7px 12px;gap:10px}
  #top-bar .sep,.brand{display:none}
  #sound-toggle-btn{top:calc(10px + env(safe-area-inset-top,0px));padding:9px 11px}#sound-label{display:none}
  #bottom-hud{left:auto;right:calc(10px + env(safe-area-inset-right,0px));bottom:auto;top:50%;transform:translateY(-50%);align-items:stretch;gap:8px;max-width:none}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
  .row .sep{display:none}
  .lbl{display:block;grid-column:1/-1;margin:0 0 0 2px}
  #new-game-btn{grid-column:1/-1}
  .btn{padding:7px 9px;font-size:.7rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="top-bar" class="glass">
  <span class="brand">Wizard's Sanctuary</span>
  <div class="sep"></div>
  <span class="turn"><i class="dot" id="turn-dot"></i><span id="turn-indicator">White (Marble) to Move</span></span>
  <div class="sep"></div>
  <span id="faction-badge">ASSIGNING FACTION...</span>
</div>

<button id="sound-toggle-btn" class="glass" title="Toggle audio"><span id="sound-icon">🔊</span><span id="sound-label">Sound On</span></button>

<div id="bottom-hud">
  <div class="row glass">
    <span class="lbl">Mode</span>
    <button id="mode-ai-btn" class="btn active">🤖 AI</button>
    <button id="mode-2p-btn" class="btn"><span class="full">2 Players</span><span class="short">2P</span></button>
    <div class="sep"></div>
    <button id="new-game-btn" class="btn" title="New match" aria-label="New match"><span class="full">New Sanctuary Match</span><span class="short">↻</span></button>
  </div>
  <div class="row glass">
    <span class="lbl">Promotion</span>
    <button class="btn promo-btn active" data-promo="q" title="Promote to Queen" aria-label="Promote to Queen">♕<span class="pn"> Queen</span></button>
    <button class="btn promo-btn" data-promo="r" title="Promote to Rook" aria-label="Promote to Rook">♖<span class="pn"> Rook</span></button>
    <button class="btn promo-btn" data-promo="b" title="Promote to Bishop" aria-label="Promote to Bishop">♗<span class="pn"> Bishop</span></button>
    <button class="btn promo-btn" data-promo="n" title="Promote to Knight" aria-label="Promote to Knight">♘<span class="pn"> Knight</span></button>
  </div>
</div>

<div id="modal-overlay">
  <div id="modal-box" class="glass">
    <div class="m-title">⚠️ Match In Progress</div>
    <div class="m-desc">Cannot change player mode while a match is in progress. Forfeit the current board and start a new game in the chosen mode, or keep playing?</div>
    <div class="m-act">
      <button id="modal-continue-btn" class="btn">Continue Current Game</button>
      <button id="modal-newgame-btn" class="btn active">Start New Game</button>
    </div>
  </div>
</div>

<div id="result-overlay">
  <div id="result-box" class="glass">
    <div class="r-eyebrow" id="result-eyebrow">Match Complete</div>
    <div class="r-title" id="result-title">Checkmate</div>
    <div class="r-desc" id="result-desc"></div>
    <div class="r-meta" id="result-meta"></div>
    <div class="r-score" id="result-score"></div>
    <div class="m-act">
      <button id="result-review-btn" class="btn">Review Board</button>
      <button id="result-again-btn" class="btn active">Play Again</button>
    </div>
  </div>
</div>

<div id="canvas-container"></div>
<div id="vignette"></div>

<script>
/* ================= 1. AUDIO ================= */
class SoundEffects{
  constructor(){this.ctx=null;this.muted=false}
  init(){if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(A)this.ctx=new A()}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()}
  toggleMute(){this.muted=!this.muted;if(!this.muted){this.init();this.playClick()}return this.muted}
  tone(type,f0,f1,dur,vol,delay=0){
    const n=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);
    g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);
    o.connect(g);g.connect(this.ctx.destination);o.start(n);o.stop(n+dur+.01)}
  play(fn){if(this.muted)return;this.init();if(this.ctx)fn()}
  playClick(){this.play(()=>this.tone('sine',520,260,.045,.12))}
  playSlide(){this.play(()=>this.tone('triangle',140,92,.18,.18))}
  playPlace(){this.play(()=>{this.tone('sine',170,60,.14,.22);this.tone('triangle',620,300,.05,.05)})}
  playEnd(kind){this.play(()=>{const seq=kind==='win'?[523,659,784,1047]:kind==='loss'?[392,330,262,196]:[440,392,440,330];
    seq.forEach((f,i)=>this.tone('triangle',f,f*.98,.38,.16,i*.17))})}
  playShatter(){this.play(()=>{this.tone('sawtooth',110,38,.32,.28);
    [880,1140,1520,1980].forEach((f,i)=>this.tone('sine',f,f*.65,.22,.07,i*.028))})}
}
const sfx=new SoundEffects();

/* ================= 2. CHESS ENGINE ================= */
const PCODE={p:1,n:2,b:3,r:4,q:5,k:6};
const PST={
p:[0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
n:[-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
b:[-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,10,10,5,0,-10, -10,5,5,10,10,5,5,-10, -10,0,10,10,10,10,0,-10, -10,10,10,10,10,10,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
r:[0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
q:[-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
k:[-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20]
};
const KJ=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
const ORTHO=[[-1,0],[1,0],[0,-1],[0,1]],DIAG=[[-1,-1],[-1,1],[1,-1],[1,1]];

class ChessState{
  constructor(init=true){if(init)this.reset()}
  reset(){
    this.board=Array(8).fill(null).map(()=>Array(8).fill(null));
    const back=['r','n','b','q','k','b','n','r'];let id=1;
    for(let c=0;c<8;c++){
      this.board[0][c]={id:id++,type:back[c],color:'b',moved:false};
      this.board[1][c]={id:id++,type:'p',color:'b',moved:false};
      this.board[6][c]={id:id++,type:'p',color:'w',moved:false};
      this.board[7][c]={id:id++,type:back[c],color:'w',moved:false};
    }
    this.turn='w';this.epSquare=null;this.moveCount=0;this.halfmove=0;
    this.log=[];this.positions=[this.positionKey()];    // move list + position keys, used for repetition and for the AI
  }
  clone(){
    const o=new ChessState(false);o.board=this.board.map(row=>row.slice());
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=this.board[r][c];o.board[r][c]=p?{...p}:null}
    o.turn=this.turn;o.epSquare=this.epSquare?{...this.epSquare}:null;o.moveCount=this.moveCount;o.halfmove=this.halfmove;return o;
  }
  inBounds(r,c){return r>=0&&r<8&&c>=0&&c<8}
  findKing(col){for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=this.board[r][c];if(p&&p.color===col&&p.type==='k')return{r,c}}return null}
  isSquareAttacked(r,c,by){
    const pd=by==='w'?1:-1;
    for(const dc of[-1,1]){const pr=r+pd,pc=c+dc;if(this.inBounds(pr,pc)){const p=this.board[pr][pc];if(p&&p.color===by&&p.type==='p')return true}}

/* Converts the live game into the compact job the engine understands. */
function buildAIJob(state){
  const b=new Array(64).fill(0);
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=state.board[r][c];if(p)b[r*8+c]=(p.color==='w'?1:-1)*PCODE[p.type]}
  const cr=state.castleRights();
  const cas=(cr.includes('K')?1:0)|(cr.includes('Q')?2:0)|(cr.includes('k')?4:0)|(cr.includes('q')?8:0);
  const ep=state.epSquare?state.epSquare.r*8+state.epSquare.c:-1;
  return{b,turn:state.turn==='w'?1:-1,cas,ep,half:state.halfmove,moves:state.log};
}

/* ---------------------------------------------------------------------------
   AI ENGINE — a compact alpha-beta searcher (this is NOT Stockfish).
   Works on a flat 64-square array with make/unmake (no object cloning), so it

   Search : iterative deepening, principal-variation search, transposition

            reductions, killer/history/MVV-LVA ordering, check extensions,
            quiescence search, repetition + 50-move awareness.

            endgame, bishop pair, passed/isolated/doubled pawns, rook files,
            king shelter, and a mop-up term for converting won endgames.

    const p=pr?us*P:b[to];
    b[from]=p;
    if(fl&2){b[to]=0;b[to+(us===1?8:-8)]=-us*P}else b[to]=cap;
    if(p===K||p===-K)kingSq[us===1?0:1]=from;
    if(fl&4){
      if(to===62){b[63]=b[61];b[61]=0}else if(to===58){b[56]=b[59];b[59]=0}else if(to===6){b[7]=b[5];b[5]=0}else{b[0]=b[3];b[3]=0}
    }
    cas=uCas[hp];ep=uEp[hp];half=uHalf[hp];
    hp--;h1=hH1[hp];h2=hH2[hp];
  }
  function makeNull(){
    const nhp=hp+1;uEp[nhp]=ep;uHalf[nhp]=half;
    if(ep>=0){h1^=ZE1[ep&7];h2^=ZE2[ep&7]}
    ep=-1;stm=-stm;h1^=ZS1;h2^=ZS2;half++;
    hp=nhp;hH1[hp]=h1;hH2[hp]=h2;
  }
  function unmakeNull(){
    stm=-stm;ep=uEp[hp];half=uHalf[hp];hp--;h1=hH1[hp];h2=hH2[hp];
  }
  const kingAttacked=()=>attacked(kingSq[stm===1?1:0],stm);        // after make(): did the side that just moved leave its king in check?
  const inCheckNow=()=>attacked(kingSq[stm===1?0:1],-stm);
  const isRep=()=>{const lim=half<hp?half:hp;for(let i=2;i<=lim;i+=2)if(hH1[hp-i]===h1&&hH2[hp-i]===h2)return true;return false};

  /* ---- evaluation ---- */
  const fileW=new Int8Array(8),fileB=new Int8Array(8),wMaxRow=new Int8Array(8),bMinRow=new Int8Array(8),pawnList=new Int8Array(20),rookList=new Int8Array(20);
  function evaluate(){
    let mg=0,eg=0,phase=0,np=0,nr=0,wB=0,bB=0,minors=0,heavy=0,wMat=0,bMat=0;
    fileW.fill(0);fileB.fill(0);wMaxRow.fill(-1);bMinRow.fill(8);
    for(let sq=0;sq<64;sq++){
      const p=b[sq];if(p===0)continue;
      const i=(p+6)*64+sq;mg+=PMG[i];eg+=PEG[i];
      const a=p<0?-p:p;
      if(p>0)wMat+=VAL[a];else bMat+=VAL[a];
      if(a===P){
        const c=sq&7,r=sq>>3;
        if(p>0){fileW[c]++;if(r>wMaxRow[c])wMaxRow[c]=r}else{fileB[c]++;if(r<bMinRow[c])bMinRow[c]=r}
        if(np<20)pawnList[np++]=sq;
      }else if(a===N||a===B){phase++;minors++;if(a===B){if(p>0)wB++;else bB++}}
      else if(a===R){phase+=2;heavy++;if(nr<20)rookList[nr++]=sq}
      else if(a===Q){phase+=4;heavy++}
    }
    if(np===0&&heavy===0&&minors<=1)return 0;                    // K vs K, K+minor vs K
    for(let k=0;k<np;k++){
      const sq=pawnList[k],p=b[sq],c=sq&7,r=sq>>3;
      if(p>0){
        let passed=true;
        for(let f=c>0?c-1:0,fe=c<7?c+1:7;f<=fe;f++)if(bMinRow[f]<r){passed=false;break}
        if(passed){const rel=7-r;mg+=PASS_MG[rel];eg+=PASS_EG[rel]}
        if((c===0||fileW[c-1]===0)&&(c===7||fileW[c+1]===0)){mg-=10;eg-=14}
      }else{
        let passed=true;
        for(let f=c>0?c-1:0,fe=c<7?c+1:7;f<=fe;f++)if(wMaxRow[f]>r){passed=false;break}
        if(passed){mg-=PASS_MG[r];eg-=PASS_EG[r]}
        if((c===0||fileB[c-1]===0)&&(c===7||fileB[c+1]===0)){mg+=10;eg+=14}
      }
    }
    for(let f=0;f<8;f++){
      if(fileW[f]>1){mg-=10*(fileW[f]-1);eg-=18*(fileW[f]-1)}
      if(fileB[f]>1){mg+=10*(fileB[f]-1);eg+=18*(fileB[f]-1)}
    }
    for(let k=0;k<nr;k++){
      const sq=rookList[k],c=sq&7;
      if(b[sq]>0){if(fileW[c]===0){if(fileB[c]===0){mg+=20;eg+=10}else{mg+=10;eg+=5}}}
      else if(fileB[c]===0){if(fileW[c]===0){mg-=20;eg-=10}else{mg-=10;eg-=5}}
    }
    if(wB>=2){mg+=30;eg+=50}
    if(bB>=2){mg-=30;eg-=50}
    {                                                            // king shelter (middlegame only)
      const wk=kingSq[0],wr=wk>>3,wc=wk&7;
      if(wr>=6){
        for(let f=wc>0?wc-1:0,fe=wc<7?wc+1:7;f<=fe;f++){
          if(b[(wr-1)*8+f]===P)mg+=8;else if(wr>=2&&b[(wr-2)*8+f]===P)mg+=3;
        }
        if(fileW[wc]===0)mg-=12;
      }
      const bk=kingSq[1],br=bk>>3,bc=bk&7;
      if(br<=1){
        for(let f=bc>0?bc-1:0,fe=bc<7?bc+1:7;f<=fe;f++){
          if(b[(br+1)*8+f]===-P)mg-=8;else if(br<=5&&b[(br+2)*8+f]===-P)mg-=3;
        }
        if(fileB[bc]===0)mg+=12;
      }
    }
    if(phase<10){                                                // mop-up: drive the lone king to the edge / bring ours close
      const s=wMat>bMat+250?1:bMat>wMat+250?-1:0;
      if(s!==0){
        const lk=s>0?kingSq[1]:kingSq[0],wk2=s>0?kingSq[0]:kingSq[1];
        const lr=lk>>3,lc=lk&7,wr2=wk2>>3,wc2=wk2&7;
        const cd=Math.abs(lr-3.5)+Math.abs(lc-3.5),kd=Math.abs(lr-wr2)+Math.abs(lc-wc2);

  }

  /* ---- search ---- */
  const TTBITS=20,TTMASK=(1<<TTBITS)-1;
  const ttH=new Int32Array(1<<TTBITS),ttM=new Int32Array(1<<TTBITS),ttS=new Int16Array(1<<TTBITS),ttD=new Int8Array(1<<TTBITS).fill(-1),ttF=new Uint8Array(1<<TTBITS);
  const killers=new Int32Array(MAXPLY*2+8),history=new Int32Array(2*4096);
  let nodes=0,stop=false,endTime=0,rootBest=0;

  function scoreMoves(ply,n,ttMove){
    const mv=moveBuf[ply],sc=scoreBuf[ply],ci=stm===1?0:1,k1=killers[ply*2],k2=killers[ply*2+1];
    for(let i=0;i<n;i++){
      const m=mv[i],fl=m>>15;let s;
      if(m===ttMove)s=10000000;
      else if(fl&1){
        const victim=(fl&2)?P:Math.abs(b[(m>>6)&63]),att=Math.abs(b[m&63]);
        s=100000+VALS[victim]*16-VALS[att]+(((m>>12)&7)===Q?90000:0);
      }else if(((m>>12)&7)===Q)s=190000;
      else if(m===k1)s=90000;
      else if(m===k2)s=80000;
      else{const h=history[ci*4096+(m&4095)];s=h>70000?70000:h}
      sc[i]=s;
    }
  }
  function pick(ply,i,n){
    const mv=moveBuf[ply],sc=scoreBuf[ply];let bi=i,bs=sc[i];
    for(let j=i+1;j<n;j++)if(sc[j]>bs){bs=sc[j];bi=j}
    if(bi!==i){const tm=mv[i];mv[i]=mv[bi];mv[bi]=tm;const ts=sc[i];sc[i]=sc[bi];sc[bi]=ts}
    return mv[i];
  }
  function hasPieces(){
    const us=stm;
    for(let sq=0;sq<64;sq++){const t=b[sq]*us;if(t>=N&&t<=Q)return true}
    return false;
  }

  function qsearch(alpha,beta,ply){
    if((nodes&1023)===0&&Date.now()>endTime)stop=true;
    if(stop)return 0;
    nodes++;
    if(ply>=MAXPLY-2)return evaluate();
    const inChk=inCheckNow();
    let best,stand=-INF;
    if(inChk)best=-MATE+ply;
    else{
      stand=evaluate();
      if(stand>=beta)return stand;
      if(stand>alpha)alpha=stand;
      best=stand;
    }
    const n=genMoves(ply,!inChk);
    scoreMoves(ply,n,0);
    let legal=0;
    for(let i=0;i<n;i++){
      const m=pick(ply,i,n),fl=m>>15;
      if(!inChk&&((m>>12)&7)===0){
        const victim=(fl&2)?P:Math.abs(b[(m>>6)&63]);
        if(stand+VAL[victim]+200<=alpha)continue;               // delta pruning
      }
      make(m);
      if(kingAttacked()){unmake(m);continue}
      legal++;
      const sc=-qsearch(-beta,-alpha,ply+1);
      unmake(m);
      if(stop)return 0;
      if(sc>best){best=sc;if(sc>alpha){alpha=sc;if(sc>=beta)break}}
    }
    if(inChk&&legal===0)return -MATE+ply;
    return best;
  }

  function search(depth,alpha,beta,ply,doNull){
    if((nodes&1023)===0&&Date.now()>endTime)stop=true;
    if(stop)return 0;
    nodes++;
    if(ply>0){
      if(half>=100)return 0;
      if(isRep())return 0;
      const lo=-MATE+ply,hi=MATE-ply-1;
      if(alpha<lo)alpha=lo;if(beta>hi)beta=hi;
      if(alpha>=beta)return alpha;
    }
    const inChk=inCheckNow();
    if(inChk)depth++;
    if(depth<=0)return qsearch(alpha,beta,ply);
    if(ply>=MAXPLY-2)return evaluate();
    const pv=beta-alpha>1;

    let ttMove=0;
    const ti=h1&TTMASK;
    if(ttD[ti]>=0&&ttH[ti]===h2){
      ttMove=ttM[ti];
      if(!pv&&ttD[ti]>=depth){
        let s=ttS[ti];
        if(s>MATE-200)s-=ply;else if(s<-MATE+200)s+=ply;
        const f=ttF[ti];
        if(f===0)return s;
        if(f===2&&s>=beta)return s;
        if(f===1&&s<=alpha)return s;
      }
    }

    let stat=0;
    if(!inChk){
      stat=evaluate();
      if(!pv&&beta<MATE-300){
        if(depth<=3&&stat-120*depth>=beta)return stat-120*depth;   // reverse futility
        if(doNull&&depth>=3&&stat>=beta&&hasPieces()){             // null move
          const R2=depth>=6?3:2;
          makeNull();
          const s=-search(depth-1-R2,-beta,-beta+1,ply+1,false);
          unmakeNull();
          if(stop)return 0;
          if(s>=beta)return s>=MATE-300?beta:s;
        }
      }
    }

    const n=genMoves(ply,false);
    scoreMoves(ply,n,ttMove);
    const ci=stm===1?0:1,origAlpha=alpha;
    let best=-INF,bestMove=0,legal=0;
    for(let i=0;i<n;i++){
      const m=pick(ply,i,n),fl=m>>15,isCap=(fl&1)!==0,isPromo=((m>>12)&7)!==0;
      make(m);
      if(kingAttacked()){unmake(m);continue}
      legal++;
      const quiet=!isCap&&!isPromo;
      let chk=false;
      if(quiet||depth>=3)chk=inCheckNow();
      if(!pv&&!inChk&&quiet&&!chk&&legal>1&&depth<=2&&alpha>-MATE+300&&stat+(depth===1?150:320)<=alpha){unmake(m);continue}   // futility
      let s;
      if(legal===1)s=-search(depth-1,-beta,-alpha,ply+1,true);
      else{
        let red=0;
        if(depth>=3&&legal>=4&&quiet&&!inChk&&!chk){red=1+(legal>=8?1:0)+(depth>=7?1:0);if(pv)red--;if(red<0)red=0}
        s=-search(depth-1-red,-alpha-1,-alpha,ply+1,true);
        if(s>alpha&&red>0)s=-search(depth-1,-alpha-1,-alpha,ply+1,true);
        if(s>alpha&&s<beta)s=-search(depth-1,-beta,-alpha,ply+1,true);
      }

          if(ply===0)rootBest=m;
          if(s>=beta){
            if(quiet){
              if(killers[ply*2]!==m){killers[ply*2+1]=killers[ply*2];killers[ply*2]=m}

    if(ttD[ti]<0||ttH[ti]!==h2||depth>=ttD[ti]){

  }

  function legalRootMoves(){
    const n=genMoves(0,false),out=[];
    for(let i=0;i<n;i++){const m=moveBuf[0][i];make(m);const ok=!kingAttacked();unmake(m);if(ok)out.push(m)}

  }

  /* ---- public API ---- */
  function load(job){
    allPromos=true;
    let ok=!(job.moves&&job.moves.length>1700);
    setPosition(START,1,15,-1,0);                                // replay the game so repetition history is known
    if(ok&&job.moves){
      for(const mvv of job.moves){
        const n=genMoves(0,false);let found=0;
        for(let i=0;i<n;i++){const m=moveBuf[0][i];if((m&63)===mvv[0]&&((m>>6)&63)===mvv[1]&&((m>>12)&7)===mvv[2]){found=m;break}}
        if(!found){ok=false;break}
        make(found);
        if(kingAttacked()){ok=false;break}
      }
    }
    if(ok){
      const jb=job.b;
      for(let i=0;i<64;i++)if(b[i]!==jb[i]){ok=false;break}
      if(stm!==job.turn||cas!==job.cas||ep!==job.ep)ok=false;
    }
    if(!ok)setPosition(job.b,job.turn,job.cas,job.ep,job.half||0);
    else half=job.half!==undefined?job.half:half;
    allPromos=false;
    return ok;
  }
  function think(cfg){
    cfg=cfg||{};
    const timeMs=cfg.timeMs||1500,maxDepth=Math.min(cfg.maxDepth||14,MAXPLY-8);
    const t0=Date.now();endTime=t0+timeMs;stop=false;nodes=0;rootBest=0;
    killers.fill(0);history.fill(0);
    const root=legalRootMoves();
    if(root.length===0)return null;
    const fmt=(m,d,s)=>({from:m&63,to:(m>>6)&63,promo:(m>>12)&7,depth:d,score:s,nodes,ms:Date.now()-t0});
    if(root.length===1)return fmt(root[0],0,0);

    if(cfg.varied){                                              // opening variety: pick among near-equal moves
      endTime=t0+timeMs*3;
      const sc=[];
      for(const m of root){make(m);const s=-search(4,-INF,INF,1,true);unmake(m);sc.push(s)}
      if(!stop){
        let top=-INF;for(const s of sc)if(s>top)top=s;
        const cand=[];for(let i=0;i<root.length;i++)if(sc[i]>=top-(cfg.variance||20))cand.push(i);
        const pickI=cand[Math.floor(Math.random()*cand.length)];

    let bestMove=root[0],bestScore=0,done=0;
    for(let d=1;d<=maxDepth;d++){
      rootBest=0;
      const s=search(d,-INF,INF,0,false);
      if(stop)break;
      if(rootBest)bestMove=rootBest;
      bestScore=s;done=d;
      if(Math.abs(s)>MATE-200&&d>=(MATE-Math.abs(s))+1)break;   // forced mate found and fully searched
      if(Date.now()-t0>timeMs*0.5)break;                        // next iteration will not finish

    return fmt(bestMove,done,bestScore);

  function perft(d,ply){
    if(d===0)return 1;
    const n=genMoves(ply,false);let t=0;
    for(let i=0;i<n;i++){
      const m=moveBuf[ply][i];make(m);
      if(!kingAttacked())t+=d===1?1:perft(d-1,ply+1);
      unmake(m);
    }
    return t;
  }
  return{
    load,think,
    perft:d=>{allPromos=true;const r=perft(d,0);allPromos=false;return r},
    setRaw:(arr,turn,casv,epv,halfv)=>setPosition(arr,turn,casv,epv,halfv),
    evaluate:()=>evaluate(),
    legal:()=>legalRootMoves()
  };
}

function chooseBestMoveAI(job){
  const G=(typeof self!=='undefined')?self:globalThis;
  const E=G.__aiEngine||(G.__aiEngine=createEngine());
  E.load(job);
  return E.think(job.cfg);
}

const maxAniso=Math.min(4,renderer.capabilities.getMaxAnisotropy());
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`};
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')]};
const tex=cv=>{const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;return t};
const seeded=s=>{let n=s;return()=>(n=(n*16807)%2147483647)/2147483647};

function makeMarbleTexture(base,vein,seed,size=128){
  const[cv,g]=mkCanvas(size,size);
  g.fillStyle=base;g.fillRect(0,0,size,size);
  const rand=seeded(seed);
  for(let i=0;i<16;i++){                                       // soft cloudy blotches
    const x=rand()*size,y=rand()*size,r=size*(.12+rand()*.3),gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,rgba(vein,1));gr.addColorStop(1,rgba(vein,0));
    g.globalAlpha=.05+rand()*.08;g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);
  }
  g.strokeStyle=vein;g.lineCap='round';g.lineJoin='round';
  const vn=(x,y,ang,len,w,a,depth)=>{                          // branching veins
    const br=[];g.globalAlpha=a;g.lineWidth=w*size/256;g.beginPath();g.moveTo(x,y);
    for(let i=0;i<len;i++){
      ang+=(rand()-.5)*.7;x+=Math.cos(ang)*size/40;y+=Math.sin(ang)*size/40;g.lineTo(x,y);
      if(depth>0&&rand()<.07)br.push([x,y,ang+(rand()-.5)*1.8,(len*.5)|0]);
    }
    g.stroke();br.forEach(b=>vn(b[0],b[1],b[2],b[3],w*.55,a*.8,depth-1));
  };
  for(let i=0;i<7;i++)vn(rand()*size,rand()*size,rand()*6.28,(22+rand()*20)|0,.8+rand()*1.8,.1+rand()*.18,2);
  g.globalAlpha=1;
  return tex(cv);
}

const BASE=[[0,0],[.40,0],[.42,.025],[.42,.07],[.38,.10],[.33,.115],[.28,.15]];

function buildKnightHeadGeo(){
  const s=new THREE.Shape();
  s.moveTo(-.2,0);s.lineTo(.22,0);s.lineTo(.2,.14);
  s.quadraticCurveTo(.16,.24,.12,.3);                    // throat
  s.quadraticCurveTo(.2,.31,.3,.32);                     // jaw
  s.quadraticCurveTo(.37,.34,.36,.43);                   // muzzle
  s.quadraticCurveTo(.3,.52,.22,.62);                    // face
  s.lineTo(.2,.8);s.lineTo(.1,.7);                       // ear
  s.quadraticCurveTo(.04,.72,-.02,.66);
  s.quadraticCurveTo(-.14,.5,-.2,.3);                    // mane
  s.quadraticCurveTo(-.24,.15,-.2,0);
  const g=new THREE.ExtrudeGeometry(s,{depth:.2,bevelEnabled:true,bevelThickness:.03,bevelSize:.03,bevelSegments:3,curveSegments:10});
  g.translate(0,0,-.1);g.rotateY(-Math.PI/2);            // shape +x (forward) -> +z
  return g;
}

function createPieceMeshGroup(pd){
  const group=new THREE.Group(),w=pd.color==='w',t=pd.type;
  const body=w?MATERIALS.marblePiece:MATERIALS.obsidianPiece,acc=w?MATERIALS.marbleAccent:MATERIALS.obsidianAccent;
  const add=(geo,mat,x,y,z,rx)=>{
    const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(rx)m.rotation.x=rx;
    m.castShadow=true;m.receiveShadow=true;group.add(m);return m;
  };
  const ring=(y,r)=>{const m=add(GEO.ring,acc,0,y,0,Math.PI/2);m.scale.setScalar(r);return m};

  if(t==='p'){
    add(GEO.pawnBody,body,0,0,0);ring(.455,.215);add(GEO.pawnHead,body,0,.66,0);
  }else if(t==='r'){
    add(GEO.rookBody,body,0,0,0);ring(.57,.295);
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2,m=add(GEO.merlon,body,Math.sin(a)*.295,.87,Math.cos(a)*.295);m.rotation.y=a}
  }else if(t==='n'){
    add(GEO.knightBody,body,0,0,0);ring(.455,.275);
    const h=add(GEO.knightHead,body,0,.44,-.06);h.scale.setScalar(.85);
    [-1,1].forEach(s=>add(GEO.eye,acc,s*.125,.865,.127));
  }else if(t==='b'){
    add(GEO.bishopBody,body,0,0,0);ring(.585,.215);
    add(GEO.bishopMitre,body,0,.63,0);add(GEO.orb,acc,0,1.13,0);
    const sl=add(GEO.slit,acc,0,.86,.02);sl.rotation.x=0;sl.rotation.z=.55;sl.scale.set(1,1,.9);
  }else if(t==='q'){
    add(GEO.tallBody,body,0,0,0);ring(.85,.235);ring(.5,.17);
    add(GEO.queenCrown,acc,0,.87,0);
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2,x=Math.sin(a)*.27,z=Math.cos(a)*.27;
      add(GEO.spike,acc,x,1.14,z);add(GEO.orb,acc,x,1.23,z).scale.setScalar(.75)}
    add(GEO.orb,acc,0,1.1,0).scale.setScalar(1.6);
  }else{
    add(GEO.tallBody,body,0,0,0);ring(.85,.235);ring(.5,.17);
    add(GEO.kingCrown,acc,0,.87,0);
    add(GEO.crossV,acc,0,1.22,0);add(GEO.crossH,acc,0,1.28,0);
  }

  const pivot=new THREE.Group();pivot.position.set(.22,.38,0);
  const sm=(geo,mat,y)=>{const m=new THREE.Mesh(geo,mat);m.position.y=y;m.castShadow=true;pivot.add(m)};
  sm(GEO.blade,MATERIALS.blade,.27);sm(GEO.guard,acc,.05);sm(GEO.grip,MATERIALS.metalDark||acc,-.03);sm(GEO.pommel,acc,-.11);
  group.add(pivot);
  group.userData={id:pd.id,weaponPivot:pivot,phase:Math.random()*Math.PI*2};
  group.rotation.y=w?Math.PI:0;
  return group;
}

/* ---- small-screen mode (phones, small tablets, phones on their side) ----
   The pillars, gothic arches, wall slabs and stained-glass windows are not rendered: from the top-down view they
   only cover the board, and skipping them saves draw calls and fill-rate on mobile GPUs. Everything else
   (altar, board, pieces, braziers, rune circle, mist, lighting, sky) is untouched. */
const compactMQ=window.matchMedia('(max-width:820px), (max-height:560px)');
const isCompact=()=>compactMQ.matches;
function applyCompact(){
  const c=isCompact();
  WORLD.structure.forEach(o=>{o.visible=!c});
  controls.enablePan=!c;                       // two-finger drags only zoom/rotate, so the board can't be pushed off-screen
  renderer.shadowMap.needsUpdate=true;
}

/* area of the screen not covered by the HUD panels (top bar, bottom bar or right-docked panel) */
function freeRect(){
  const W=window.innerWidth,H=window.innerHeight;let x0=0,y0=0,x1=W,y1=H;
  const tb=document.getElementById('top-bar').getBoundingClientRect(),hud=document.getElementById('bottom-hud').getBoundingClientRect();
  if(tb.height&&tb.top<H*.5)y0=Math.max(y0,tb.bottom+4);
  if(hud.height){
    if(hud.left>W*.55&&hud.width<W*.45)x1=Math.min(x1,hud.left-6);
    else y1=Math.min(y1,hud.top-6);
  }
  if(y1-y0<H*.3){y0=0;y1=H}
  if(x1-x0<W*.3){x0=0;x1=W}
  return{x0,y0,x1,y1,W,H};
}
/* choose a camera distance (and view shift) so the whole board + graveyards fit any aspect ratio */
function fitCamera(opts){
  opts=opts||{};
  const f=freeRect(),aspect=f.W/f.H,vTan=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)),hTan=vTan*aspect;
  let dir;
  if(opts.reset){
    const elev=THREE.MathUtils.degToRad(THREE.MathUtils.clamp(34+(1.5-aspect)*22,34,66));   // tall screens look more top-down
    dir=new THREE.Vector3(0,Math.sin(elev),Math.cos(elev)*camSide);controls.target.set(0,0,0);
  }else dir=camera.position.clone().sub(controls.target).normalize();
  const sinE=Math.abs(dir.y),cosE=Math.sqrt(Math.max(0,1-dir.y*dir.y));
  const cmp=isCompact();                                                  // small screens: tighter framing = bigger board
  const halfW=cmp?6.7:7.3,halfH=4.7*sinE+1.5*cosE+.2;
  const dH=halfW/(hTan*((f.x1-f.x0)/f.W)),dV=halfH/(vTan*((f.y1-f.y0)/f.H));
  const dist=Math.max(dH,dV)*(cmp?1.03:1.06);
  camera.position.copy(controls.target).addScaledVector(dir,dist);
  controls.minDistance=Math.min(6.5,dist*.6);controls.maxDistance=dist*1.8;
  const cx=(f.x0+f.x1)/2-f.W/2,cy=(f.y0+f.y1)/2-f.H/2;           // centre the board in the free area
  if(Math.abs(cx)>.5||Math.abs(cy)>.5)camera.setViewOffset(f.W,f.H,-cx,-cy,f.W,f.H);else camera.clearViewOffset();
  camera.aspect=aspect;camera.updateProjectionMatrix();controls.update();
}
function orientCameraForFaction(color){camSide=color==='w'?1:-1;lastPortrait=window.innerWidth<window.innerHeight;fitCamera({reset:true})}

function rebuildAllPieces3D(){

    const p=chess.board[r][c];if(!p)continue;
    const m=createPieceMeshGroup(p);m.position.copy(boardToWorld(r,c));scene.add(m);pieceMeshes.set(p.id,m);
  }
}

const SIDE_NAME={w:'White (Marble)',b:'Black (Obsidian)'};
function finishGame(res){
  if(resultRecorded)return;
  resultRecorded=true;gameOver=true;
  const turnEl=document.getElementById('turn-indicator');
  const DRAW_LABEL={stalemate:'Stalemate',insufficient:'Insufficient Material',repetition:'Threefold Repetition',fifty:'Fifty-Move Rule'};
  turnEl.textContent=res.type==='checkmate'?`Checkmate — ${SIDE_NAME[res.winner]} Triumphs`:`Draw — ${DRAW_LABEL[res.type]}`;
  if(res.type==='checkmate'){
    if(res.winner==='w')tally.white++;else tally.black++;
    if(gameMode==='ai'){if(res.winner===humanColor)tally.you++;else tally.ai++}
    const k=chess.findKing(chess.turn);                                   // mark the mated king
    if(k){const ring=new THREE.Mesh(ringGeo,matCapture);ring.position.set(k.c-3.5,LAYER_Y.INDICATOR,k.r-3.5);indicatorGroup.add(ring)}
  }else tally.draw++;
  const id=matchId;
  setTimeout(()=>{if(id===matchId)showResult(res)},1100);                // let the final move play out first
}
function showResult(res){
  const el=i=>document.getElementById(i),ai=gameMode==='ai',mate=res.type==='checkmate';
  const humanWon=mate&&ai&&res.winner===humanColor,humanLost=mate&&ai&&res.winner!==humanColor;
  const DESC={
    checkmate:`${SIDE_NAME[res.winner==='w'?'b':'w']} has no escape — the king is trapped.`,
    stalemate:'The side to move has no legal move, but its king is not in check.',
    insufficient:'Neither side has enough material left to deliver checkmate.',
    repetition:'The same position has appeared three times.',
    fifty:'Fifty moves have passed without a capture or a pawn move.'
  };
  el('result-eyebrow').textContent=!mate?'Draw':ai?(humanWon?'Victory':'Defeat'):`${SIDE_NAME[res.winner]} Triumphs`;
  el('result-title').textContent=mate?'Checkmate':({stalemate:'Stalemate',insufficient:'Dead Position',repetition:'Repetition',fifty:'Fifty-Move Draw'})[res.type];
  el('result-desc').textContent=DESC[res.type];
  el('result-meta').textContent=`${Math.ceil(chess.moveCount/2)} moves played`;
  el('result-score').textContent=ai?`You ${tally.you} · AI ${tally.ai} · Draws ${tally.draw}`:`White ${tally.white} · Black ${tally.black} · Draws ${tally.draw}`;
  const box=el('result-box');box.classList.remove('win','loss','draw');box.classList.add(humanLost?'loss':mate?'win':'draw');
  sfx.playEnd(humanLost?'loss':mate?'win':'draw');
  el('result-overlay').classList.add('open');
}

function executeAnimatedMove(move){

  const mp=chess.board[move.fromR][move.fromC];

  if(move.capture){victimMesh=pieceMeshes.get(move.capture.id);victimColor=move.capture.color}
  if(move.castle){const rp=chess.board[move.fromR][move.rookFromC];
    if(rp){rookMesh=pieceMeshes.get(rp.id);rookStart=boardToWorld(move.fromR,move.rookFromC);rookEnd=boardToWorld(move.fromR,move.rookToC)}}
  sfx.playSlide();
  activeAnim={move,movingPiece:mp,moverMesh:pieceMeshes.get(mp.id),startPos:boardToWorld(move.fromR,move.fromC),endPos:boardToWorld(move.toR,move.toC),
    victimMesh,victimColor,rookMesh,rookStart,rookEnd,elapsed:0,duration:move.capture?.56:.36,shattered:false};
}

  chess.reset();gameOver=false;isAnimating=false;activeAnim=null;selectedSquare=null;validMovesForSelected=[];clearIndicators();

/* ---- AI strength --------------------------------------------------------------
   timeMs   : thinking time per move (the search stops earlier when a forced result is found)
   maxDepth : hard cap on search depth in plies
   varied   : pick among near-equal moves in the first moves so games differ (variance in centipawns)
   The search runs in a Web Worker, so the 3D scene never freezes while the AI thinks. */
const AI_LEVEL={timeMs:1800,maxDepth:14,varied:true,variance:20};
let aiJob=0,aiThinking=false;
let aiWorker=(function(){
  try{
    const src=`const PST=${JSON.stringify(PST)};
${createEngine.toString()}
${chooseBestMoveAI.toString()}
onmessage=e=>{const d=e.data;postMessage({job:d.job,res:chooseBestMoveAI(d)})};`;
    return new Worker(URL.createObjectURL(new Blob([src],{type:'application/javascript'})));
  }catch(err){return null}
})();
const aiCanMove=()=>!(gameOver||isAnimating||gameMode!=='ai'||chess.turn===humanColor);
function playEngineResult(res){
  if(!res||!aiCanMove())return;
  const legal=chess.getLegalMoves(chess.turn,'q');if(!legal.length)return;
  const fr=res.from>>3,fc=res.from&7,tr=res.to>>3,tc=res.to&7;
  const mv=legal.find(m=>m.fromR===fr&&m.fromC===fc&&m.toR===tr&&m.toC===tc)||legal[Math.floor(Math.random()*legal.length)];
  executeAnimatedMove(mv);
}
if(aiWorker){
  aiWorker.onmessage=e=>{if(e.data.job!==aiJob)return;aiThinking=false;playEngineResult(e.data.res)};
  aiWorker.onerror=()=>{aiWorker=null;aiThinking=false;setTimeout(triggerAIMove,50)};
}
function triggerAIMove(){
  if(aiThinking||!aiCanMove())return;
  aiThinking=true;const job=++aiJob;
  document.getElementById('turn-indicator').textContent=`${SIDE_NAME[chess.turn]} is thinking…`;
  const data=buildAIJob(chess);data.job=job;
  data.cfg={...AI_LEVEL,varied:AI_LEVEL.varied&&chess.moveCount<10};
  if(aiWorker){aiWorker.postMessage(data);return}
  data.cfg.timeMs=Math.min(data.cfg.timeMs,900);                          // no worker available: keep the page responsive
  setTimeout(()=>{if(job!==aiJob)return;aiThinking=false;playEngineResult(chooseBestMoveAI(data))},30);
}

const raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2(),boardPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-LAYER_Y.BOARD_TILE),planeHit=new THREE.Vector3();
let dragState=null;
function getSquareFromEvent(e){
  const rc=renderer.domElement.getBoundingClientRect();
  ndc.x=((e.clientX-rc.left)/rc.width)*2-1;ndc.y=-((e.clientY-rc.top)/rc.height)*2+1;
  raycaster.setFromCamera(ndc,camera);
  if(raycaster.ray.intersectPlane(boardPlane,planeHit)){
    const c=Math.floor(planeHit.x+4),r=Math.floor(planeHit.z+4);
    if(chess.inBounds(r,c))return{r,c,point:planeHit.clone()};
  }
  return null;
}
const canHumanControlTurn=()=>!(gameOver||isAnimating||(gameMode==='ai'&&chess.turn!==humanColor));

renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.button!==0||!canHumanControlTurn())return;
  const hit=getSquareFromEvent(e);if(!hit)return;
  const p=chess.board[hit.r][hit.c];
  if(p&&p.color===chess.turn)dragState={r:hit.r,c:hit.c,mesh:pieceMeshes.get(p.id),startX:e.clientX,startY:e.clientY,isDragging:false};
});
window.addEventListener('pointermove',e=>{
  if(!dragState)return;
  if(!dragState.isDragging&&Math.hypot(e.clientX-dragState.startX,e.clientY-dragState.startY)>6){
    dragState.isDragging=true;controls.enabled=false;selectedSquare={r:dragState.r,c:dragState.c};
    validMovesForSelected=chess.getLegalMoves(chess.turn,promoPiece).filter(m=>m.fromR===dragState.r&&m.fromC===dragState.c);
    showIndicatorsForSquare(dragState.r,dragState.c,validMovesForSelected);
  }
  if(dragState.isDragging){
    const hit=getSquareFromEvent(e);
    if(hit&&dragState.mesh){dragState.mesh.position.set(hit.point.x,.52,hit.point.z);
      hoverHighlight.position.set(hit.c-3.5,LAYER_Y.INDICATOR,hit.r-3.5);hoverHighlight.visible=true}
  }
});
window.addEventListener('pointerup',e=>{
  if(!dragState&&e.target!==renderer.domElement)return;
  controls.enabled=true;hoverHighlight.visible=false;
  if(!canHumanControlTurn()){dragState=null;return}
  const hit=getSquareFromEvent(e);
  if(dragState&&dragState.isDragging){
    const{r,c,mesh}=dragState;dragState=null;
    if(hit){const mv=validMovesForSelected.find(m=>m.toR===hit.r&&m.toC===hit.c);if(mv){executeAnimatedMove(mv);return}}
    if(mesh)mesh.position.copy(boardToWorld(r,c));
    return;
  }
  dragState=null;if(!hit)return;
  if(selectedSquare){const mv=validMovesForSelected.find(m=>m.toR===hit.r&&m.toC===hit.c);if(mv){executeAnimatedMove(mv);return}}
  const cp=chess.board[hit.r][hit.c];
  if(cp&&cp.color===chess.turn){
    sfx.playClick();selectedSquare={r:hit.r,c:hit.c};
    validMovesForSelected=chess.getLegalMoves(chess.turn,promoPiece).filter(m=>m.fromR===hit.r&&m.fromC===hit.c);
    showIndicatorsForSquare(hit.r,hit.c,validMovesForSelected);
  }else{selectedSquare=null;validMovesForSelected=[];clearIndicators()}
});

/* ================= 12. HUD ================= */
const $=id=>document.getElementById(id),overlay=$('modal-overlay');
$('sound-toggle-btn').addEventListener('click',()=>{
  const m=sfx.toggleMute();$('sound-toggle-btn').classList.toggle('muted',m);
  $('sound-icon').textContent=m?'🔇':'🔊';$('sound-label').textContent=m?'Muted':'Sound On';
});
function requestModeChange(t){
  sfx.playClick();if(t===gameMode)return;
  if(chess.moveCount>0&&!gameOver){pendingModeSwitch=t;overlay.classList.add('open')}else startNewMatch(t);
}
$('mode-ai-btn').addEventListener('click',()=>requestModeChange('ai'));
$('mode-2p-btn').addEventListener('click',()=>requestModeChange('2p'));
$('new-game-btn').addEventListener('click',()=>{sfx.playClick();startNewMatch(gameMode)});
$('modal-continue-btn').addEventListener('click',()=>{sfx.playClick();pendingModeSwitch=null;overlay.classList.remove('open')});
$('modal-newgame-btn').addEventListener('click',()=>{
  sfx.playClick();const t=pendingModeSwitch||gameMode;pendingModeSwitch=null;overlay.classList.remove('open');startNewMatch(t);
});
$('result-review-btn').addEventListener('click',()=>{sfx.playClick();$('result-overlay').classList.remove('open')});
$('result-again-btn').addEventListener('click',()=>{sfx.playClick();$('result-overlay').classList.remove('open');startNewMatch(gameMode)});
document.querySelectorAll('.promo-btn').forEach(b=>b.addEventListener('click',()=>{
  sfx.playClick();document.querySelectorAll('.promo-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');promoPiece=b.dataset.promo;
}));
let resizeRaf=0;
function onResize(){
  cancelAnimationFrame(resizeRaf);
  resizeRaf=requestAnimationFrame(()=>{
    applyRendererSize();
    const portrait=window.innerWidth<window.innerHeight;
    if(portrait!==lastPortrait){lastPortrait=portrait;fitCamera({reset:true})}else fitCamera();
  });
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(onResize,250));
if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);

/* ================= 13. LOOP ================= */
const clock=new THREE.Clock();let frameNo=0,perfAcc=0,perfN=0;
function animate(){
  requestAnimationFrame(animate);
  const raw=clock.getDelta(),dt=Math.min(raw,.05),el=clock.getElapsedTime();
  frameNo++;
  if(raw<.25){                                                  // adaptive resolution: trade pixels for smoothness
    perfAcc+=raw;perfN++;
    if(perfAcc>=1.5){
      const avg=perfAcc/perfN;perfAcc=0;perfN=0;
      if(avg>.026&&pixelRatio>PR_MIN+.01){pixelRatio=Math.max(PR_MIN,pixelRatio-.15);applyRendererSize()}
      else if(avg<.0185&&pixelRatio<PR_MAX-.01){pixelRatio=Math.min(PR_MAX,pixelRatio+.1);applyRendererSize()}
    }
  }

  pieceMeshes.forEach(m=>{
    if(m.userData.inGraveyard)return;
    const wp=m.userData.weaponPivot;
    if(wp&&(!activeAnim||activeAnim.moverMesh!==m))wp.rotation.x=Math.sin(el*2.2+m.userData.phase)*.08;
  });

  if(activeAnim){
    const a=activeAnim;a.elapsed+=dt;
    const t=Math.min(a.elapsed/a.duration,1),s=t*t*(3-2*t);
    if(a.moverMesh){
      a.moverMesh.position.lerpVectors(a.startPos,a.endPos,s);
      const hop=a.movingPiece.type==='n'?.95:(a.move.capture?.22:.1);
      a.moverMesh.position.y=LAYER_Y.PIECE_BASE+Math.sin(t*Math.PI)*hop;
      if(a.move.capture&&a.moverMesh.userData.weaponPivot)a.moverMesh.userData.weaponPivot.rotation.x=t<.55?-t*1.6:(t-.55)*3.8;
    }
    if(a.rookMesh)a.rookMesh.position.lerpVectors(a.rookStart,a.rookEnd,s);
    if(a.move.capture&&!a.shattered&&t>=.68){
      a.shattered=true;sfx.playShatter();triggerShatterBurst(a.endPos,a.victimColor);
      if(a.victimMesh)sendPieceToGraveyardTrough(a.victimMesh,a.victimColor);
    }
    if(t>=1){
      const mv=a.move,mm=a.moverMesh;
      if(mm&&mm.userData.weaponPivot)mm.userData.weaponPivot.rotation.x=0;
      chess.applyMove(mv);chess.record(mv);
      if(!mv.capture)sfx.playPlace();
      if(mv.promo){
        const pp=chess.board[mv.toR][mv.toC];
        if(mm)scene.remove(mm);
        const nm=createPieceMeshGroup(pp);nm.position.copy(boardToWorld(mv.toR,mv.toC));scene.add(nm);pieceMeshes.set(pp.id,nm);
      }
      activeAnim=null;isAnimating=false;updateStatusHUD();
      if(gameMode==='ai'&&!gameOver&&chess.turn!==humanColor)setTimeout(triggerAIMove,260);
    }
  }

  shardPool.forEach(s=>{
    if(!s.mesh.visible)return;
    s.life-=dt*1.35;if(s.life<=0){s.mesh.visible=false;return}
    s.vel.y-=9.8*dt;s.mesh.position.addScaledVector(s.vel,dt);
    if(s.mesh.position.y<LAYER_Y.PIECE_BASE){s.mesh.position.y=LAYER_Y.PIECE_BASE;s.vel.y*=-.45;s.vel.x*=.7;s.vel.z*=.7}
    s.mesh.rotation.x+=s.rot.x*dt;s.mesh.rotation.y+=s.rot.y*dt;s.mesh.scale.setScalar(Math.max(.01,s.life));
  });

  const pulse=1+Math.sin(el*5)*.08;
  indicatorGroup.children.forEach(ch=>ch.scale.setScalar(pulse));

  // brazier flicker
  WORLD.flames.forEach(f=>{
    const k=.82+.18*Math.sin(el*9+f.phase)+.08*Math.sin(el*23+f.phase*2);
    if(f.light)f.light.intensity=f.base*k;
    f.sprite.scale.set(.6*k,1.0*(.9+.15*k),1);f.core.scale.set(.3*k,.5*(.9+.2*k),1);
  });
  // light shafts breathe
  WORLD.beams.forEach(b=>{b.material.opacity=b.base*(.78+.22*Math.sin(el*.6+b.i*1.3))});
  // rune circle and mist drift
  WORLD.spin.forEach(s=>{s.mesh.rotation.y+=s.speed*dt});
  // embers
  if(WORLD.embers){
    const arr=WORLD.embers.geo.attributes.position.array;
    for(let i=0;i<WORLD.embers.n;i++){
      const m=WORLD.embers.meta[i];m.y+=dt*m.sp;if(m.y>5)m.y=0;
      arr[i*3]=m.bx+Math.sin(el*.9+m.ph)*.25*(m.y*.4);arr[i*3+1]=1.1+m.y;arr[i*3+2]=m.bz+Math.cos(el*.8+m.ph)*.25*(m.y*.4);
    }
    WORLD.embers.geo.attributes.position.needsUpdate=true;
  }

  const mp=moteGeo.attributes.position.array;
  for(let i=0;i<MOTE_N;i++){
    mp[i*3+1]+=dt*(.12+(i%5)*.03);mp[i*3]+=Math.sin(el*.4+i)*dt*.08;
    if(mp[i*3+1]>12)mp[i*3+1]=0;
  }
  moteGeo.attributes.position.needsUpdate=true;

  const dragging=dragState&&dragState.isDragging,shardsOn=shardPool.some(s=>s.mesh.visible);
  if(activeAnim||dragging||shardsOn||frameNo%6===0)renderer.shadowMap.needsUpdate=true;
  controls.update();renderer.render(scene,camera);
}
applyCompact();
startNewMatch('ai');renderer.compile(scene,camera);animate();
setTimeout(()=>fitCamera(),900);
</script>
